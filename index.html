<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olívia Sertã | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-color: #F6F4F0;
            --accent-green: #2C4A3E; 
            --accent-gold: #C2A675;  
            --text-dark: #1F2421;
            --text-muted: #656A67;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Montserrat', sans-serif;
        }
        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .content { text-align: center; padding: 40px; }
        .slide-tag {
            display: inline-block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 3px;
            color: var(--accent-green); font-weight: 600; margin-bottom: 20px; 
            border-bottom: 1px solid var(--accent-green); padding-bottom: 4px;
        }
        h1 { font-family: var(--font-heading); font-size: 3.6rem; font-weight: 300; color: var(--text-dark); margin-bottom: 10px; }
        .subtitle { 
            color: var(--accent-gold); font-size: 1.1rem; margin-bottom: 25px; 
            letter-spacing: 2px; text-transform: uppercase; font-weight: 400; 
        }
        .status { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1.5px; font-style: italic; }
    </style>
</head>
<body>
    <div class="content">
        <span class="slide-tag">Portfólio Profissional</span>
        <h1>Olívia Sertã</h1>
        <p class="subtitle">Design, Decoração & Arquitetura de Festas</p>
        <p class="status">Página em construção</p>
    </div>
</body>
</html>
